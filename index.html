<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #jeu { position: absolute; image-rendering: pixelated; image-rendering: crisp-edges; }
  /* Commandes tactiles : seulement sur écran tactile (classe posée par le script) */
  #tactile { display: none; }
  body.tactile #tactile { display: block; }
  .pad { position: fixed; left: max(18px, env(safe-area-inset-left)); bottom: max(18px, env(safe-area-inset-bottom));
    width: 132px; height: 132px; touch-action: none; }
  .pad i { position: absolute; background: rgba(40, 40, 60, .55); border: 3px solid rgba(255, 255, 255, .45); box-sizing: border-box; }

  .pad .fg.actif { border-right-color: #ff0; } .pad .fd.actif { border-left-color: #ff0; }
  .pad .fh.actif { border-bottom-color: #ff0; } .pad .fb.actif { border-top-color: #ff0; }
  .rond { position: fixed; width: 74px; height: 74px; border-radius: 50%; border: 4px solid rgba(255, 255, 255, .6);
    color: #fff; font: bold 12px/1 monospace; letter-spacing: 1px; display: grid; place-items: center; touch-action: none; box-sizing: border-box; }
  .rond.appui { transform: scale(.92); filter: brightness(1.4); }
  #b-pouce { right: max(104px, calc(env(safe-area-inset-right) + 104px)); bottom: max(26px, env(safe-area-inset-bottom));
    background: radial-gradient(circle at 35% 30%, #c87838, #6a3010); }
  #b-saut { right: max(18px, env(safe-area-inset-right)); bottom: max(92px, calc(env(safe-area-inset-bottom) + 74px));
    background: radial-gradient(circle at 35% 30%, #f05050, #901020); }

    width: 62px; height: 30px; border-radius: 15px; border: 3px solid rgba(255, 255, 255, .5); background: rgba(40, 40, 60, .55); color: #fff;
    font: bold 14px/1 monospace; display: grid; place-items: center; box-sizing: border-box; }

<body>
<canvas id="jeu"></canvas>
<div id="tactile">
  <div class="pad" id="pad"><i class="h"></i><i class="v"></i><b class="fg"></b><b class="fd"></b><b class="fh"></b><b class="fb"></b></div>

<script>
'use strict';
// =====================================================================================
//  RÉGLAGES : les valeurs faciles à changer
// =====================================================================================
const REGLAGES = {
  COUPS_POUR_TUER: 3,        // coups dans le dos pour un ennemi normal (étape 2)
  POUCES_POUR_POUVOIR: 3,    // ennemis tués pour activer le choco-noisette (étape 2)
  POUVOIR_DUREE_ENNEMIS: 2,  // le pouvoir dure pour ce nombre d'ennemis tués (étape 2)
  VIE_BOSS: 30,              // coups pour battre le Général Constipax (étape 4)
  VIE_HEROS: 100,
  VITESSE_MARCHE: 72,        // pixels par seconde
  VITESSE_PROFONDEUR: 46,    // monter / descendre dans la rue
  VITESSE_DASH: 310,         // « il court pas, il dash »
  DUREE_DASH: 0.22,          // secondes
  DOUBLE_APPUI: 0.28,        // secondes entre deux appuis pour déclencher le dash
  HAUTEUR_SAUT: 98,          // pixels (l'écran en fait 224) : « il saute pas, il flash »
  GRAVITE: 950,
  LONGUEUR_MONDE: 3200,      // longueur de la rue du monde 1, en pixels
  DELAI_RETOURNEMENT: 1.1,   // secondes avant qu'un voyou dépassé se retourne vers le héros (monde 1)
  DEGATS_ENNEMI: 8,          // vie perdue par coup de voyou reçu
  POUVOIR_DE_FACE: false,    // true : pendant le choco-noisette, les coups de face comptent aussi
  DUREE_ANIM_POUVOIR: 1.4,   // secondes de l'animation « CHOCO-NOISETTE ACTIVÉ ! » (le jeu est figé)
};
// Les quatre niveaux de difficulté, choisis après START. Chaque valeur multiplie les réglages ci-dessus :
// retour (délai avant que les gardes se retournent), degats (vie perdue), vitesse (des gardes), sonne (secondes
// pendant lesquelles le BOUM de l'atterrissage fige les gardes), vieBoss et boss (vie et vitesse du Général).
const DIFFICULTES = [
  { nom: 'CHOCOLAT AU LAIT', niveau: 'FACILE', tablette: ['#c8915a', '#a8703a', '#e8b880'], retour: 1.7, degats: 0.5, vitesse: 0.85, sonne: 2.6, vieBoss: 0.6, boss: 0.75 },
  { nom: 'CHOCOLAT NOIR', niveau: 'NORMAL', tablette: ['#6a3a1a', '#4a2410', '#8a5a34'], retour: 1.3, degats: 0.75, vitesse: 0.95, sonne: 2.2, vieBoss: 0.8, boss: 0.9 },
  { nom: 'CHOCOLAT 100 %', niveau: 'DIFFICILE', tablette: ['#3a1e0e', '#24120a', '#5a3420'], retour: 1, degats: 1, vitesse: 1, sonne: 1.8, vieBoss: 1, boss: 1 },
  { nom: 'CHOCO-NOISETTE', niveau: 'TRÈS DIFFICILE', tablette: ['#7a4422', '#5a3014', '#9a6a3c'], noisettes: true, retour: 0.8, degats: 1.3, vitesse: 1.12, sonne: 1.2, vieBoss: 1.2, boss: 1.15 },
];
let difficulte = 1;
try { const d = Number(localStorage.getItem('chocopouce-difficulte')); if (d >= 0 && d < DIFFICULTES.length && localStorage.getItem('chocopouce-difficulte') !== null) difficulte = d; } catch {}
const D = () => DIFFICULTES[difficulte];

// =====================================================================================
//  Écran : 320 × 224 comme la Mega Drive, agrandi sans flou, bandes noires si besoin
// =====================================================================================
const L = 320, H = 224;
const cv = document.getElementById('jeu');
cv.width = L; cv.height = H;
const g = cv.getContext('2d');
g.imageSmoothingEnabled = false;
const tactile = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
if (tactile) document.body.classList.add('tactile');
function redimensionner() {
  const W = innerWidth, Hh = innerHeight;
  let s = Math.min(W / L, Hh / H);
  if (s >= 2 && Math.floor(s) / s > 0.88) s = Math.floor(s); // pixels bien réguliers quand on perd peu
  const w = Math.round(L * s), h = Math.round(H * s);
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  cv.style.left = Math.round((W - w) / 2) + 'px';
  // Téléphone tenu droit : le jeu en haut, les commandes dessous dans le noir
  cv.style.top = (tactile && Hh > W ? Math.max(0, Math.round((Hh - 190 - h) / 2)) : Math.round((Hh - h) / 2)) + 'px';
}
addEventListener('resize', redimensionner);
redimensionner();

const toile = (l, h, dessin) => { const c = document.createElement('canvas'); c.width = l; c.height = h; const x = c.getContext('2d'); x.imageSmoothingEnabled = false; dessin && dessin(x); return c; };
function alea(graine) { let a = graine >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function disque(x, cx, cy, r, c) { x.fillStyle = c; for (let dy = -r; dy <= r; dy++) { const w = Math.floor(Math.sqrt(r * r - dy * dy)); x.fillRect(cx - w, cy + dy, 2 * w + 1, 1); } }

// =====================================================================================
//  Police pixel 5 × 7 (avec accents), dessinée dans le code
// =====================================================================================
const POLICE = {
  A: '01110 10001 10001 11111 10001 10001 10001', B: '11110 10001 10001 11110 10001 10001 11110',
  C: '01110 10001 10000 10000 10000 10001 01110', D: '11110 10001 10001 10001 10001 10001 11110',
  E: '11111 10000 10000 11110 10000 10000 11111', F: '11111 10000 10000 11110 10000 10000 10000',
  G: '01110 10001 10000 10111 10001 10001 01111', H: '10001 10001 10001 11111 10001 10001 10001',
  I: '01110 00100 00100 00100 00100 00100 01110', J: '00111 00010 00010 00010 00010 10010 01100',
  K: '10001 10010 10100 11000 10100 10010 10001', L: '10000 10000 10000 10000 10000 10000 11111',
  M: '10001 11011 10101 10101 10001 10001 10001', N: '10001 11001 10101 10011 10001 10001 10001',
  O: '01110 10001 10001 10001 10001 10001 01110', P: '11110 10001 10001 11110 10000 10000 10000',
  Q: '01110 10001 10001 10001 10101 10010 01101', R: '11110 10001 10001 11110 10100 10010 10001',
  S: '01111 10000 10000 01110 00001 00001 11110', T: '11111 00100 00100 00100 00100 00100 00100',
  U: '10001 10001 10001 10001 10001 10001 01110', V: '10001 10001 10001 10001 10001 01010 00100',
  W: '10001 10001 10001 10101 10101 10101 01010', X: '10001 10001 01010 00100 01010 10001 10001',
  Y: '10001 10001 01010 00100 00100 00100 00100', Z: '11111 00001 00010 00100 01000 10000 11111',
  0: '01110 10001 10011 10101 11001 10001 01110', 1: '00100 01100 00100 00100 00100 00100 01110',
  2: '01110 10001 00001 00010 00100 01000 11111', 3: '11110 00001 00001 01110 00001 00001 11110',
  4: '00010 00110 01010 10010 11111 00010 00010', 5: '11111 10000 11110 00001 00001 10001 01110',
  6: '00110 01000 10000 11110 10001 10001 01110', 7: '11111 00001 00010 00100 01000 01000 01000',
  8: '01110 10001 10001 01110 10001 10001 01110', 9: '01110 10001 10001 01111 00001 00010 01100',
  '!': '00100 00100 00100 00100 00100 00000 00100', '?': '01110 10001 00001 00010 00100 00000 00100',
  '.': '00000 00000 00000 00000 00000 00000 00100', ',': '00000 00000 00000 00000 00000 00100 01000',
  ':': '00000 00100 00000 00000 00000 00100 00000', '-': '00000 00000 00000 11111 00000 00000 00000',
  "'": '00100 00100 01000 00000 00000 00000 00000', '%': '11001 11010 00010 00100 01000 01011 10011', '/': '00001 00010 00010 00100 01000 01000 10000',
  '©': '01110 10001 10111 10101 10111 10001 01110', '·': '00000 00000 00000 00100 00000 00000 00000', '×': '00000 10001 01010 00100 01010 10001 00000',
  '+': '00000 00100 00100 11111 00100 00100 00000', ' ': '00000 00000 00000 00000 00000 00000 00000', '►': '10000 11000 11100 11110 11100 11000 10000',
};
const ACCENTS = { É: ['E', 'aigu'], È: ['E', 'grave'], Ê: ['E', 'circ'], Ë: ['E', 'trema'], À: ['A', 'grave'], Â: ['A', 'circ'],
  Ç: ['C', 'ced'], Î: ['I', 'circ'], Ï: ['I', 'trema'], Ô: ['O', 'circ'], Ù: ['U', 'grave'], Û: ['U', 'circ'], Ü: ['U', 'trema'] };
const MARQUES = { aigu: ['00010', '00100'], grave: ['01000', '00100'], circ: ['00100', '01010'], trema: ['00000', '01010'], ced: ['00100', '01000'] };
const bits = (s) => s.split(' ').map((r) => parseInt(r, 2));
// Les lignes d'un caractère : [numéro de ligne (-2 à 8), bits], 0 à 6 pour la lettre, au-dessus ou dessous pour l'accent.
function glyphe(ch) {
  const a = ACCENTS[ch];
  const base = bits(POLICE[a ? a[0] : ch] ?? POLICE['?']).map((b, i) => [i, b]);
  if (!a) return base;
  const m = bits(MARQUES[a[1]].join(' '));
  return a[1] === 'ced' ? [...base, [7, m[0]], [8, m[1]]] : [[-2, m[0]], [-1, m[1]], ...base];
}
// Un texte rendu une fois dans une petite toile (gardée) : couleur unie ou une couleur par ligne (dégradé chocolat).
const cacheTexte = new Map();
function rendreTexte(str, couleur, s, contour) {
  const cle = `${str}|${couleur}|${s}|${contour}`;
  let c = cacheTexte.get(cle);
  if (c) return c;
  const chars = [...str.toUpperCase()];
  const pad = contour ? s : 0;
  c = toile(chars.length * 6 * s + pad * 2, 11 * s + pad * 2);
  const x = c.getContext('2d');
  const poser = (col, dx, dy) => chars.forEach((ch, i) => {
    for (const [r, b] of glyphe(ch)) for (let k = 0; k < 5; k++) if (b & (16 >> k)) {
      x.fillStyle = Array.isArray(col) ? col[Math.max(0, Math.min(col.length - 1, r))] : col;
      x.fillRect(pad + (i * 6 + k) * s + dx, pad + (r + 2) * s + dy, s, s);
    }
  });
  if (contour) for (const [dx, dy] of [[-s, 0], [s, 0], [0, -s], [0, s], [s, s], [-s, s], [s, -s], [-s, -s]]) poser(contour, dx, dy);
  poser(couleur, 0, 0);
  cacheTexte.set(cle, c);
  return c;
}
// Écrit un texte ; y est le haut des capitales ; align : 'g', 'c' ou 'd'.
function texte(str, x, y, couleur = '#fff', s = 1, contour = '#000', align = 'g') {
  const c = rendreTexte(str, couleur, s, contour);
  const pad = contour ? s : 0;
  const w = c.width - pad * 2 - s;
  const x0 = align === 'c' ? x - w / 2 : align === 'd' ? x - w : x;
  g.drawImage(c, Math.round(x0) - pad, Math.round(y) - 2 * s - pad);
}
const CHOCO = ['#ffd8a0', '#f0a860', '#c87838', '#a05a24', '#7e4016', '#62300e', '#4e240a', '#4e240a', '#4e240a'];

// =====================================================================================
//  Sons chiptune (Web Audio), et le générique (generique.mp3 s'il est dans le dossier)
// =====================================================================================
let actx = null, maitre = null, bruitBuf = null;
function audioInit() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  actx = new AC();
  maitre = actx.createGain(); maitre.gain.value = 0.32; maitre.connect(actx.destination);
  bruitBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
  const d = bruitBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function bip(type, f0, f1, duree, vol = 0.4, debut = 0, sortie = maitre) {
  const t = actx.currentTime + debut;
  const o = actx.createOscillator(), v = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + duree);
  v.gain.setValueAtTime(vol, t);
  v.gain.exponentialRampToValueAtTime(0.0008, t + duree);
  o.connect(v).connect(sortie);
  o.start(t); o.stop(t + duree + 0.03);
}
function bruit(duree, vol, f0, f1, debut = 0, sortie = maitre) {
  const t = actx.currentTime + debut;
  const s = actx.createBufferSource(), f = actx.createBiquadFilter(), v = actx.createGain();
  s.buffer = bruitBuf; f.type = 'bandpass'; f.Q.value = 1.2;
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + duree);
  v.gain.setValueAtTime(vol, t); v.gain.exponentialRampToValueAtTime(0.0008, t + duree);
  s.connect(f).connect(v).connect(sortie);
  s.start(t); s.stop(t + duree + 0.03);
}
const SONS = {
  // Le « ting » du logo, façon cloche FM de console 16 bits
  ting() { bip('sine', 2093, 2093, 1.1, 0.45); bip('sine', 4186, 4186, 0.5, 0.12); bip('triangle', 3136, 3136, 0.7, 0.18, 0.02); bip('square', 1046, 1046, 0.08, 0.05); },
  balayage() { bip('square', 180, 1400, 1.1, 0.05); bruit(1.1, 0.12, 300, 5000); },
  saut() { bip('square', 220, 900, 0.16, 0.25); bip('square', 440, 1800, 0.1, 0.08, 0.03); bruit(0.12, 0.15, 4000, 9000); },
  dash() { bruit(0.22, 0.45, 4500, 500); bip('sawtooth', 600, 150, 0.15, 0.08); },
  boum() { bip('sine', 150, 32, 0.38, 0.9); bruit(0.28, 0.55, 900, 80); },
  coup() { bip('square', 760, 190, 0.08, 0.2); bruit(0.07, 0.25, 2500, 700); },
  ting2() { bip('triangle', 1900, 1880, 0.22, 0.3); bip('triangle', 2850, 2830, 0.18, 0.12); },
  start() { [523, 659, 784, 1046].forEach((f, i) => bip('square', f, f, 0.12, 0.16, i * 0.07)); bip('square', 1568, 1568, 0.4, 0.14, 0.28); },
  pause() { bip('square', 880, 880, 0.06, 0.15); bip('square', 660, 660, 0.06, 0.15, 0.08); },
  impact() { bruit(0.12, 0.6, 1800, 300); bip('square', 220, 80, 0.12, 0.3); },
  rire() { [520, 440, 520, 440].forEach((f, i) => bip('square', f, f * 0.9, 0.07, 0.12, i * 0.09)); },
  ko() { bip('square', 600, 60, 0.5, 0.22); bruit(0.3, 0.4, 1200, 200); },
  aie() { bip('sawtooth', 320, 90, 0.25, 0.28); bruit(0.1, 0.3, 900, 300); },
  retourne() { bip('square', 300, 620, 0.06, 0.07); },
  go() { bip('square', 988, 988, 0.08, 0.15); bip('square', 1318, 1318, 0.12, 0.15, 0.1); },
  pouvoir() {
    [523, 659, 784, 1046, 1318].forEach((f, i) => bip('square', f, f, 0.14, 0.18, i * 0.08));
    bip('square', 1568, 1568, 0.7, 0.16, 0.42); bip('triangle', 784, 784, 0.9, 0.35, 0.42); bruit(0.5, 0.3, 3000, 8000, 0.42);
  },
  monde() { [392, 523, 659, 784].forEach((f, i) => bip('square', f, f, 0.16, 0.14, i * 0.14)); bip('square', 1046, 1046, 0.5, 0.14, 0.56); bip('triangle', 131, 131, 0.9, 0.3, 0.56); },
  pouf() { bruit(0.25, 0.7, 700, 80); bip('sine', 240, 55, 0.22, 0.45); },
  // Un cri « AAAAH ! » de dessin animé : une voix en dents de scie qui monte puis retombe, avec du vibrato
  cri() {
    const t = actx.currentTime, h = 0.85 + Math.random() * 0.4;
    const o = actx.createOscillator(), lfo = actx.createOscillator(), prof = actx.createGain(), f = actx.createBiquadFilter(), v = actx.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(480 * h, t); o.frequency.linearRampToValueAtTime(660 * h, t + 0.25); o.frequency.exponentialRampToValueAtTime(240 * h, t + 1.1);
    lfo.frequency.value = 7; prof.gain.value = 24; lfo.connect(prof).connect(o.frequency);
    f.type = 'bandpass'; f.frequency.value = 1050; f.Q.value = 1.4;
    v.gain.setValueAtTime(0.0001, t); v.gain.exponentialRampToValueAtTime(0.3, t + 0.05); v.gain.setValueAtTime(0.3, t + 0.7); v.gain.exponentialRampToValueAtTime(0.0008, t + 1.15);
    o.connect(f).connect(v).connect(maitre);
    o.start(t); lfo.start(t); o.stop(t + 1.2); lfo.stop(t + 1.2);
  },
  etoile() { bip('square', 2093, 2093, 0.1, 0.08); bip('square', 2637, 2637, 0.18, 0.08, 0.08); },
  gameover() { [392, 370, 349, 330].forEach((f, i) => bip('square', f, f * 0.98, 0.32, 0.16, i * 0.34)); bip('triangle', 165, 82, 1.2, 0.35, 1.36); },
};
const son = (n) => { if (actx && actx.state === 'running') SONS[n](); };

// Le générique : « generique.aac » (ou .mp3, .m4a) à côté de ce fichier, il tourne pendant le clip de l'intro.
// Sans fichier, une petite boucle chiptune joue à sa place.
const SOURCES_GENERIQUE = ['generique.aac', 'generique.mp3', 'generique.m4a'];
const generique = new Audio();
generique.loop = false; // à la fin de la chanson : l'écran d'accueil, puis le clip recommence
generique.preload = 'auto';
let generiqueOK = false, sourceGenerique = 0, generiqueVoulu = false, generiqueAmorce = false;
generique.addEventListener('canplay', () => { generiqueOK = true; });
generique.addEventListener('playing', () => { if (!generique.muted) generiqueOK = true; });
generique.addEventListener('error', () => {
  generiqueOK = false;
  if (++sourceGenerique < SOURCES_GENERIQUE.length) generique.src = SOURCES_GENERIQUE[sourceGenerique];
});
generique.src = SOURCES_GENERIQUE[0];
const generiqueExiste = () => sourceGenerique < SOURCES_GENERIQUE.length;
// iPhone : Safari ne charge rien tant qu'on n'a pas touché l'écran (« canplay » n'arrivait jamais, d'où la petite
// boucle chiptune à la place de la chanson), et refuse de lancer un son hors d'un geste. Au tout premier toucher (ou
// touche du clavier), on lance donc la chanson en silence puis on l'arrête : ensuite, elle peut partir quand on veut.
function amorcerGenerique() {
  if (generiqueAmorce || !generiqueExiste()) return;
  generiqueAmorce = true;
  generique.muted = true;
  const p = generique.play();
  if (p) p.then(() => { if (!generiqueVoulu) generique.pause(); generique.muted = false; })
    .catch(() => { generique.muted = false; generiqueAmorce = false; });
}
let boucleChip = null;
function musiqueTitre(jouer) {
  generiqueVoulu = jouer;
  if (jouer) {
    if (!generiqueExiste()) { boucleChipDemarre(); return; }
    const lancer = () => {
      try { generique.currentTime = DEPART; } catch {}
      generique.muted = false; generique.volume = 0.9;
      generique.play().then(() => { generiqueOK = true; }).catch(() => boucleChipDemarre());
    };
    lancer();

// ——— Les musiques des mondes : chiptune épique, dans l'esprit du générique ———
// Chaque piste : la durée d'une double croche (T), la mélodie (une note MIDI par double croche, « . » = on tient
// ou silence ; 4 mesures de 16), la note de basse de chaque mesure (racines) et son motif en croches (écarts en
// demi-tons), les temps de grosse caisse et de caisse claire dans la mesure, et le son de la mélodie.
const PISTES = {

  ville: { T: 0.115, timbre: 'square', racines: [45, 41, 48, 43], basse: [0, 0, 12, 0, 0, 12, 0, 7], kick: [0, 6, 8], caisse: [4, 12],
    melo: '69 . 72 . 76 . 74 72 71 . 72 . 74 . . . 69 . 72 . 76 . 79 . 77 . 76 . 74 . . . 72 . 74 . 76 . 77 . 79 . 81 . 79 77 76 74 76 . . . 74 . 72 . 71 . 69 . . . . .' },
  // Monde 2 : la forêt (ré mineur, aventure, flûte)
  foret: { T: 0.125, timbre: 'triangle', racines: [38, 36, 34, 33], basse: [0, 7, 12, 7, 0, 7, 12, 7], kick: [0, 8], caisse: [4, 12],
    melo: '62 . 65 . 69 . . . 67 . 65 . 64 . 62 . 60 . 64 . 67 . . . 65 . 64 . 62 . . . 62 . 65 . 69 . 72 . 71 . 69 . 67 . 69 . 65 . . . 64 . . . 62 . . . . . . .' },
  // Monde 3 : le repaire (mi phrygien, menaçant)
  repaire: { T: 0.11, timbre: 'square', racines: [40, 40, 36, 41], basse: [0, 0, 12, 0, 0, 1, 0, 12], kick: [0, 3, 8, 11], caisse: [4, 12],
    melo: '64 . . 65 . . 64 . 67 . . 65 . . 64 . 64 . . 65 . . 64 . 71 . 70 . 67 . . . 76 . 74 . 72 . 71 . 72 . 71 . 69 . 67 . 65 . . . 64 . . . 63 . 64 . . . . .' },
  // Le Général Constipax (rapide, intense)
  boss: { T: 0.095, timbre: 'square', racines: [45, 45, 41, 40], basse: [0, 12, 0, 12, 0, 12, 0, 12], kick: [0, 4, 8, 12], caisse: [4, 12],
    melo: '69 72 76 72 69 72 76 79 77 76 74 72 74 76 72 71 69 72 76 72 69 72 76 81 79 77 76 74 76 . 72 . 77 . 76 . 74 . 72 . 74 . 76 . 77 . 79 . 81 . 79 . 77 . 76 . 75 . 76 . . . . .' },
};
for (const p of Object.values(PISTES)) p.notes = p.melo.split(' ').filter(Boolean).map((x) => (x === '.' ? 0 : Number(x)));
const hz = (n) => 440 * 2 ** ((n - 69) / 12);
let musique = null;
function jouerMusique(nom) {
  if (!actx) return;
  const P = PISTES[nom], notes = P.notes, n = notes.length;
  const gain = actx.createGain(); gain.gain.value = 0.42; gain.connect(maitre);
  let pas = 0, prochain = actx.currentTime + 0.08;
  const planifier = () => {
    while (prochain < actx.currentTime + 0.25) {
      const d = Math.max(0, prochain - actx.currentTime), i = pas % n, k = i % 16;
      const m = notes[i];

      }

      if (k % 2 === 0) bruit(0.03, 0.04, 8000, 7000, d, gain);

function arreterMusique() {

}
// La musique qui va avec l'écran : celle du monde en jeu, celle du Général pendant le combat, rien ailleurs
// (l'écran titre, le menu et la victoire ont la chanson).
const PISTE_MONDE = { 1: 'ville', 2: 'foret', 3: 'repaire' };
function majMusique() {
  if (!actx) return;
  let voulue = null;
  if (['jeu', 'pause', 'pouvoirAnim'].includes(etat)) voulue = boss ? (['ko', 'envole'].includes(boss.etat) ? null : 'boss') : PISTE_MONDE[monde];
  if ((musique?.nom ?? null) !== voulue) { arreterMusique(); if (voulue) jouerMusique(voulue); }

}

// =====================================================================================
//  Commandes : clavier (flèches, X coup, C saut, Entrée), croix et boutons tactiles
// =====================================================================================
const TOUCHES = { ArrowLeft: 'gauche', ArrowRight: 'droite', ArrowUp: 'haut', ArrowDown: 'bas', KeyX: 'coup', KeyC: 'saut', Space: 'saut', Enter: 'entree' };
const clavier = {}, tenu = {};
const fronts = { coup: false, saut: false, entree: false, nimporte: false, haut: false, bas: false };
let dernierAppui = { dir: 0, t: -1 }, dashDemande = 0;
const maintenant = () => performance.now() / 1000;
// Deux appuis rapides sur la même direction : DASH.
function directionPressee(dir) {
  const t = maintenant();
  // Au doigt, deux touchers sont un peu plus lents qu'au clavier : un peu plus de marge
  const delai = tactile ? Math.max(REGLAGES.DOUBLE_APPUI, 0.36) : REGLAGES.DOUBLE_APPUI;
  if (dernierAppui.dir === dir && t - dernierAppui.t < delai) { dashDemande = dir; dernierAppui = { dir: 0, t: -1 }; }

}
addEventListener('keydown', (e) => {
  audioInit();
  fronts.nimporte = true;
  const n = TOUCHES[e.code];
  if (!n) return;
  e.preventDefault();
  if (e.repeat) return;
  clavier[n] = true;
  if (n === 'gauche') directionPressee(-1);
  if (n === 'droite') directionPressee(1);
  if (n in fronts) fronts[n] = true;
});
addEventListener('keyup', (e) => { const n = TOUCHES[e.code]; if (n) clavier[n] = false; });
addEventListener('blur', () => { for (const k in clavier) clavier[k] = false; if (etat === 'jeu') basculerPause(); });
addEventListener('pointerdown', () => { audioInit(); fronts.nimporte = true; });
// La chanson du générique s'amorce au premier geste (voir amorcerGenerique) : Safari sur iPhone veut un vrai
// « toucher terminé » ou un clic, pas seulement un appui.
for (const ev of ['touchend', 'pointerup', 'click', 'keydown']) addEventListener(ev, () => { audioInit(); amorcerGenerique(); }, { passive: true });

// héros. Safari ignore « user-scalable=no » et pas toujours « touch-action » : on bloque nous-mêmes le double toucher
// et le pincement (le jeu n'a rien à zoomer ni à faire défiler).
let dernierToucher = 0;

for (const ev of ['gesturestart', 'gesturechange', 'dblclick']) document.addEventListener(ev, (e) => e.preventDefault(), { passive: false });

const pad = document.getElementById('pad');

let padId = null;
const fleches = { fg: pad.querySelector('.fg'), fd: pad.querySelector('.fd'), fh: pad.querySelector('.fh'), fb: pad.querySelector('.fb') };
function padMaj(e) {
  const r = pad.getBoundingClientRect();
  const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2), m = r.width * 0.12;
  let nx = Math.abs(dx) > m ? Math.sign(dx) : 0, ny = Math.abs(dy) > m ? Math.sign(dy) : 0;
  if (Math.abs(dy) < Math.abs(dx) * 0.45) ny = 0;
  if (Math.abs(dx) < Math.abs(dy) * 0.45) nx = 0;
  if (nx !== 0 && nx !== padDir.x) directionPressee(nx);
  if (ny < 0 && padDir.y >= 0) fronts.haut = true;
  if (ny > 0 && padDir.y <= 0) fronts.bas = true;
  padDir.x = nx; padDir.y = ny;
  fleches.fg.classList.toggle('actif', nx < 0); fleches.fd.classList.toggle('actif', nx > 0);
  fleches.fh.classList.toggle('actif', ny < 0); fleches.fb.classList.toggle('actif', ny > 0);
}
pad.addEventListener('pointerdown', (e) => { e.preventDefault(); padId = e.pointerId; pad.setPointerCapture(e.pointerId); padMaj(e); });
pad.addEventListener('pointermove', (e) => { if (e.pointerId === padId) padMaj(e); });
for (const t of ['pointerup', 'pointercancel']) pad.addEventListener(t, (e) => {

});
function boutonTactile(id, nom) {
  const b = document.getElementById(id);
  b.addEventListener('pointerdown', (e) => { e.preventDefault(); fronts[nom] = true; tenu[nom] = true; b.classList.add('appui'); });
  for (const t of ['pointerup', 'pointercancel', 'pointerleave']) b.addEventListener(t, () => { tenu[nom] = false; b.classList.remove('appui'); });
}
boutonTactile('b-pouce', 'coup');
boutonTactile('b-saut', 'saut');
boutonTactile('b-pause', 'entree');

const entree = {
  get gauche() { return clavier.gauche || padDir.x < 0; },

// =====================================================================================
//  Palette (couleurs saturées façon Mega Drive) et le héros, dessiné pixel par pixel

const PAL = {

  cheveux: '#f8d040', cheveuxOmbre: '#c89018', cheveuxClair: '#fff0a0',
  costume: '#2c5ce8', costumeOmbre: '#1a3698', costumeClair: '#6c9cff', jambe: '#1c2c88', jambeOmbre: '#121c60',
  cape: '#e02838', capeOmbre: '#901428', casque: '#c8d0e8', casqueOmbre: '#7880a8',
  ceinture: '#7a4a1c', jaune: '#f8e040', choco: '#5a2808', chocoClair: '#a8642c', chaussure: '#5a3018', oeil: '#201828', bouche: '#8a2828',
};

const PAL_COSTUME = PAL;

function dessinerHeros(x, ox, oy, f, e, t) {

  const sq = pose === 'atterrit' ? 4 : pose === 'assis' ? 17 : 0; // tassé à l'atterrissage, assis par terre (game over)
  const bob = pose === 'debout' ? (Math.sin(t * 3) > 0.55 ? 1 : 0) : pose === 'marche' ? (Math.abs(p) > 0.7 ? -1 : 0) : 0;
  const hy = bob + sq; // décalage vertical du haut du corps

  const nC = pose === 'dash' ? 24 : 18;
  const amp = pose === 'dash' ? 1.2 : pose === 'marche' ? 3 : 2.2;
  const cols = [];
  for (let i = 0; i < nC; i++) {
    const vague = Math.sin(t * (pose === 'dash' ? 16 : 8) - i * 0.55) * amp * (i / nC);
    const monte = pose === 'saut' ? (e.vh > 0 ? i * 0.9 : -i * 0.25) : pose === 'dash' ? i * 0.1 : i * 0.65;
    cols.push({ px: -10 + pench - i, top: Math.round(-45 + hy + monte + vague), len: Math.round((pose === 'dash' ? 13 : 22) - i * 0.3), ombre: Math.sin(t * 8 - i * 0.55 + 1) > 0.3 });
  }
  for (const c of cols) R(c.px, c.top - 1, 1, c.len + 2, PAL.contour);
  R(cols[nC - 1].px - 1, cols[nC - 1].top, 1, cols[nC - 1].len, PAL.contour);
  for (const c of cols) R(c.px, c.top, 1, c.len, c.ombre ? PAL.capeOmbre : PAL.cape);
  }

  const meches = [];

  for (const [a, b, w, h] of meches) R(a - 1, b - 1, w + 2, h + 2, PAL.contour);

  // Jambes
  if (pose === 'assis') {
    O(-5, -9, 17, 5, PAL.jambeOmbre); O(13, -13, 4, 8, PAL.chaussure);
    O(-3, -6, 17, 5, PAL.jambe); O(15, -10, 4, 8, PAL.chaussure);
  } else if (pose === 'saut') {
    O(-7, -22, 6, 11, PAL.jambeOmbre); O(-10, -12, 8, 4, PAL.chaussure);
    O(1, -24, 6, 9, PAL.jambe); O(3, -16, 8, 4, PAL.chaussure);
  } else if (pose === 'dash') {
    O(-12, -22, 6, 17, PAL.jambeOmbre); O(-15, -6, 8, 4, PAL.chaussure);
    O(3, -24, 6, 19, PAL.jambe); O(5, -6, 8, 4, PAL.chaussure);
  } else {

  else [['C', -6], ['P', 0]].forEach(([l, dx]) => LETTRES_CP[l].forEach((ligne, j) => { for (let k = 0; k < 5; k++) if (ligne & (16 >> k)) { x.fillStyle = PAL.jaune; x.fillRect(cx + dx + k, oy - 42 + hy + j, 1, 1); } }));

  // Cou, tête, visage

  O(-6 + pench, -62 + hy, 13, 13, PAL.peau);
  R(-6 + pench, -62 + hy, 2, 13, PAL.peauOmbre);

    O(4 + pench + Math.round(p * 2), -30 + hy, 5, 5, PAL.peau);
    pouce = [8 + pench + Math.round(p * 2), -32 + hy];

    R(pouce[0], pouce[1], 3, 1, PAL.ongle);

  let reste = n;

    const vu = l.slice(0, Math.max(0, reste));

  });

    if (suivante) texte('PROCHAINE : ' + (suivante[1] || '(LIGNE À CONFIRMER)').slice(0, 40), 4, 16, '#fff', 1, null);
    texte(T.toFixed(1) + ' S', L - 4, 4, '#80ff80', 1, null, 'd');
  } else if (Math.floor(tEtat * 2) % 2 === 0) {
    texte(tactile ? "TOUCHE L'ÉCRAN" : 'APPUIE SUR START', L - 4, 4, OR, 1, '#3a0a00', 'd');
  }
  if (fondu > 0) { g.fillStyle = `rgba(0,0,0,${fondu})`; g.fillRect(0, 0, L, H); }
}

// L'écran « MONDE n » : le numéro en lettres d'or, le nom du monde, une bande de son décor, le héros qui traverse.
function dessinerEcranMonde() {
  const t = tEtat, m = MONDES[monde];
  g.fillStyle = '#000'; g.fillRect(0, 0, L, H);
  const ouv = Math.min(1, t / 0.4);
  const hb = Math.round(56 * ouv);
  g.save(); g.beginPath(); g.rect(0, 100 - hb, L, hb * 2); g.clip();
  g.translate(0, -30);
  dessinerDecor(t * 40, t);
  g.restore();
  g.fillStyle = 'rgba(10,0,10,0.3)'; g.fillRect(0, 100 - hb, L, hb * 2);
  g.fillStyle = '#ffd040'; g.fillRect(0, 100 - hb - 2, L, 2); g.fillRect(0, 100 + hb, L, 2);
  if (t > 0.4) {
    const p = Math.min(1, (t - 0.4) / 0.25);
    texte(`MONDE ${monde}`, L / 2 - (1 - p) * 300, 14, OR, 4, '#3a0a00', 'c');
    if (t > 0.8) m.titre.forEach((ligne, i) => texte(ligne, L / 2 + Math.max(0, 1 - (t - 0.8 - i * 0.15) / 0.25) * 300, 166 + i * 18, m.couleurs, 2, '#200000', 'c'));
  }
  dessinerHeros(g, -30 + t * 70, 152, 1, { pose: 'marche', marche: t * 11, choco: heros?.choco }, t);
  if (t > 1.6 && Math.floor(t * 3) % 2 === 0) texte('PRÊT ?', L / 2, 210, '#ffffff', 1, '#000', 'c');
}
// Le Général fait son entrée : « Constipax a juré de vaincre ChocoPouce… » (et si le pouce est chargé…)
function dessinerBossIntro() {
  const t = tEtat;
  g.fillStyle = 'rgba(0,0,0,0.6)'; g.fillRect(0, 0, L, H);
  const hb = Math.round(Math.min(1, t / 0.3) * 30);
  g.fillStyle = '#000'; g.fillRect(0, 0, L, hb); g.fillRect(0, H - hb, L, hb);
  const glisse = Math.max(0, 1 - t / 0.4) * 200;
  g.save(); g.beginPath(); g.rect(0, 30, L, H - 60); g.clip();
  g.globalAlpha = (Math.sin(t * 8) + 1) * 0.12; g.fillStyle = '#ff2020'; g.fillRect(0, 0, L, H); g.globalAlpha = 1;
  constipax(80 - glisse, 128, 2, t, true, false);
  g.restore();
  const lignes = ['LE GÉNÉRAL CONSTIPAX', 'A JURÉ DE VAINCRE', 'CHOCOPOUCE...'];
  if (pouvoir > 0) lignes.push('', '...MAIS LE POUCE', 'EST DÉJÀ CHARGÉ !');
  let reste = Math.floor(Math.max(0, t - 0.5) * 30);
  lignes.forEach((l, i) => {
    const vu = l.slice(0, Math.max(0, reste)); reste -= l.length + 4;
    if (vu) texte(vu, 158, 62 + i * 14, i >= 4 ? '#ffe040' : '#ffffff', 1, '#000');
  });
  if (t > 2 && Math.floor(t * 2) % 2 === 0) texte(tactile ? 'TOUCHE POUCE' : 'START', L - 8, H - 24, OR, 1, '#3a0a00', 'd');
}
// Victoire : l'énorme pouce choco-noisette, « LE MONDE CHANTE TON NOM : CHOCOPOUCE ! », le score final.
function dessinerVictoire() {
  const t = tEtat;
  rayons(160, 128, t * 0.8, '#3a1604', '#7a3a10', 18);
  artifices(t);
  const k = Math.min(1, t / 0.4);
  grosPouce(160, 136 + (1 - k) * 160, 2, t);
  texte('LE MONDE CHANTE TON NOM :', L / 2, 10, '#ffffff', 1, '#2a0a04', 'c');
  if (t > 0.6 && Math.floor(t * 4) % 4 !== 3) g.drawImage(logo, Math.round((L - logo.width) / 2), 24);
  if (t > 1.6 && boss && boss.combat < 6) texte('K.O. DANS LES CINQ PREMIÈRES SECONDES !', L / 2, 184, '#90e870', 1, '#000', 'c');
  if (t > 1.2) texte(`SCORE FINAL ${String(score).padStart(6, '0')}`, L / 2, 196, '#ffe040', 1, '#000', 'c');
  if (t > 4 && Math.floor(t * 2) % 2 === 0) texte(tactile ? "TOUCHE L'ÉCRAN" : 'START : ÉCRAN TITRE', L / 2, 210, '#ffffff', 1, '#000', 'c');
}
// À la victoire, la chanson reprend au refrain « CHOCO POUCE ! »
function musiqueVictoire() {
  if (generiqueOK) { generique.currentTime = TEMPS_CLIP[12] ?? 0; generique.volume = 0.9; generique.play().catch(() => {}); }
  else boucleChipDemarre();
}

// Le menu de difficulté, après START : quatre tablettes de chocolat, de la plus douce à la plus corsée.
let toucheMenu = null;
cv.addEventListener('pointerdown', (e) => {
  const r = cv.getBoundingClientRect();
  toucheMenu = { x: ((e.clientX - r.left) * L) / r.width, y: ((e.clientY - r.top) * H) / r.height };
});
const optionMenu = (p) => DIFFICULTES.findIndex((_, i) => p.x > 20 && p.x < 300 && p.y > 40 + i * 40 && p.y < 76 + i * 40);
function tablette(x, y, d, t) {
  const [c, ombre, clair] = d.tablette;
  g.fillStyle = '#140804'; g.fillRect(x - 1, y - 1, 46, 28);
  g.fillStyle = ombre; g.fillRect(x, y, 44, 26);
  for (let i = 0; i < 4; i++) for (let j = 0; j < 2; j++) {
    const px = x + 2 + i * 11, py = y + 2 + j * 12;
    g.fillStyle = c; g.fillRect(px, py, 9, 10);
    g.fillStyle = clair; g.fillRect(px, py, 9, 1); g.fillRect(px, py, 1, 10);
    if (d.noisettes) { g.fillStyle = '#e8c890'; g.fillRect(px + 3 + (i % 2), py + 3 + j, 3, 3); g.fillStyle = '#b08850'; g.fillRect(px + 4 + (i % 2), py + 5 + j, 2, 1); }
  }
  // Un reflet qui passe sur la tablette choisie
  if (t) { const k = Math.round(((t * 40) % 90) - 20); g.fillStyle = 'rgba(255,255,255,0.35)'; for (let j = 0; j < 26; j++) if (k + j / 2 >= 0 && k + j / 2 < 44) g.fillRect(x + Math.round(k + j / 2), y + j, 2, 1); }
}
function dessinerMenu() {
  const t = tEtat;
  rayons(160, 112, t * 0.3, '#2a1004', '#3a1608', 16);
  texte('CHOISIS TON CHOCOLAT', L / 2, 12, OR, 2, '#3a0a00', 'c');
  DIFFICULTES.forEach((d, i) => {
    const y = 42 + i * 40, sel = i === difficulte;
    if (sel) {
      g.fillStyle = 'rgba(255,220,120,0.16)'; g.fillRect(22, y - 2, 276, 36);
      g.fillStyle = '#ffd040'; g.fillRect(22, y - 2, 276, 1); g.fillRect(22, y + 33, 276, 1); g.fillRect(22, y - 2, 1, 36); g.fillRect(297, y - 2, 1, 36);
    }
    tablette(36, y + 3, d, sel ? t : 0);
    texte(d.nom, 90, y + 6, sel ? OR : '#c8b0a0', 2, sel ? '#3a0a00' : '#1a0a04');
    texte(d.niveau, 90, y + 23, sel ? '#ffe040' : '#8a7a6a', 1, '#000');
    if (sel && Math.floor(t * 4) % 2 === 0) texte('►', 27, y + 12, '#ffe040', 1, '#000');
  });
  texte(tactile ? 'TOUCHE TON CHOCOLAT' : 'HAUT / BAS, PUIS START', L / 2, 212, '#ffffff', 1, '#000', 'c');
}

function basculerPause() {
  if (etat === 'jeu') { changerEtat('pause'); son('pause'); }
  else if (etat === 'pause') { changerEtat('jeu'); son('pause'); }
}
document.addEventListener('visibilitychange', () => { if (document.hidden && etat === 'jeu') basculerPause(); });

// =====================================================================================
//  Boucle : mise à jour à 60 images/s fixes, dessin à chaque image de l'écran
// =====================================================================================
const PAS = 1 / 60;
let avant = performance.now() / 1000, reste = 0;
function mettreAJour(dt) {
  tEtat += dt;
  if (etat === 'allumer') {
    if (fronts.nimporte) allumer();
  } else if (etat === 'boot') {
    if (tEtat > 0.3 && tEtat - dt <= 0.3) son('balayage');
    if (tEtat > 1.5 && tEtat - dt <= 1.5) son('ting');
    if (tEtat > 3.5 || (tEtat > 0.4 && (fronts.entree || fronts.coup || fronts.saut))) { changerEtat('titre'); musiqueTitre(true); }
  } else if (etat === 'titre') {
    if (fondu > 0) {
      fondu += dt * 2.5;
      if (fondu >= 1) { fondu = 0; changerEtat('menu'); }
    } else if (tEtat > 0.6 && (fronts.entree || (!CALAGE && (fronts.coup || fronts.saut || (tactile && fronts.nimporte))))) {
      son('start'); fondu = 0.01;
    }
  } else if (etat === 'jeu') {
    tJeu += dt;
    if (fronts.entree) basculerPause();
    else { majHeros(dt); majEnnemis(dt); majBoss(dt); majVagues(dt); majPigeons(dt); majParticules(dt); }
  } else if (etat === 'pause') {
    if (fronts.entree) basculerPause();
  } else if (etat === 'pouvoirAnim') {
    // Le jeu est figé le temps de l'énorme pouce
    if (tEtat >= REGLAGES.DUREE_ANIM_POUVOIR) { etat = 'jeu'; tEtat = 0; }
  } else if (etat === 'menu') {
    // Choisir son chocolat : haut / bas (clavier ou croix), START pour valider ; au doigt, toucher la tablette
    if (fronts.haut) { difficulte = (difficulte + DIFFICULTES.length - 1) % DIFFICULTES.length; son('pause'); }
    if (fronts.bas) { difficulte = (difficulte + 1) % DIFFICULTES.length; son('pause'); }
    let choisi = tEtat > 0.4 && (fronts.entree || fronts.coup || fronts.saut);
    if (toucheMenu && tEtat > 0.4) { const i = optionMenu(toucheMenu); if (i >= 0) { difficulte = i; choisi = true; } }
    toucheMenu = null;
    if (choisi) {
      try { localStorage.setItem('chocopouce-difficulte', String(difficulte)); } catch {}
      son('start'); musiqueTitre(false); nouvellePartie(); changerEtat('monde'); son('monde');
    }
  } else if (etat === 'monde') {
    // L'écran « MONDE n » avant le niveau
    if (tEtat > 3.2 || (tEtat > 0.8 && (fronts.entree || fronts.coup || fronts.saut))) changerEtat('jeu');
  } else if (etat === 'bossIntro') {
    // Le Général se présente, puis entre dans l'arène
    if (tEtat > 6 || (tEtat > 1.2 && (fronts.entree || fronts.coup || fronts.saut))) { changerEtat('jeu'); nouveauBoss(); }
  } else if (etat === 'gameover') {
    tJeu += dt;
    majParticules(dt);
    if (tEtat > 1.5 && (fronts.entree || fronts.coup || fronts.saut)) { son('start'); commencerMonde(monde, true); changerEtat('monde'); son('monde'); }
  } else if (etat === 'fin') {
    // Fin du monde : le bonus de vie s'ajoute au score, puis le monde suivant
    tJeu += dt;
    majParticules(dt);
    if (tEtat > 2.6 && finT === 0) { finT = 1; score += heros.vie * 10; son('go'); }
    if (tEtat > 3.2 && (fronts.entree || fronts.coup || fronts.saut)) { son('start'); commencerMonde(monde + 1); changerEtat('monde'); son('monde'); }
  } else if (etat === 'victoire') {
    tJeu += dt;
    if (tEtat > 4 && (fronts.entree || fronts.coup || fronts.saut || (tactile && fronts.nimporte))) { son('start'); changerEtat('titre'); accueilT = 0; musiqueTitre(true); }
  }
  // L'écran d'accueil après le clip : quand la chanson est finie, il reste 20 s, puis le clip recommence
  if (etat === 'titre' && generiqueOK && generique.ended && !CALAGE) {
    accueilT += dt;
    if (accueilT > DUREE_ACCUEIL) { accueilT = 0; generique.currentTime = 0; generique.play().catch(() => {}); }
  }
  if (etat !== 'menu') toucheMenu = null;
  majMusique();
  for (const k in fronts) fronts[k] = false;
}
function dessiner(dt) {
  if (etat === 'allumer') {
    g.fillStyle = '#000'; g.fillRect(0, 0, L, H);
    g.fillStyle = Math.floor(tEtat * 2) % 2 ? '#ff2020' : '#600808'; g.fillRect(L / 2 - 2, 96, 4, 4);
    if (Math.floor(tEtat * 1.6) % 2 === 0) texte(tactile ? "TOUCHE L'ÉCRAN POUR ALLUMER" : 'APPUIE SUR UNE TOUCHE POUR ALLUMER', L / 2, 112, '#c8c8c8', 1, null, 'c');
  } else if (etat === 'boot') dessinerBoot();
  else if (etat === 'titre') dessinerClip(tempsClip(), dt);
  else if (etat === 'monde') dessinerEcranMonde();
  else if (etat === 'menu') dessinerMenu();
  else if (etat === 'victoire') dessinerVictoire();
  else {
    dessinerJeu(tJeu);
    if (etat === 'pouvoirAnim') {
      // CHOCO-NOISETTE ACTIVÉ ! : l'énorme pouce surgit au milieu de l'écran
      const k = Math.min(1, tEtat / 0.25);
      g.globalAlpha = 0.85; rayons(160, 120, tEtat * 2, '#3a1604', '#7a3a10', 18); g.globalAlpha = 1;
      grosPouce(160, 128 + (1 - k) * 160, 4, tEtat);
      if (Math.floor(tEtat * 8) % 2 === 0) {
        texte('CHOCO-NOISETTE', 160, 16, CHOCO, 3, '#1a0802', 'c');
        texte('ACTIVÉ !', 160, 44, OR, 3, '#3a0a00', 'c');
      }
      if (tEtat < 0.12) { g.fillStyle = `rgba(255,255,255,${1 - tEtat / 0.12})`; g.fillRect(0, 0, L, H); }
    } else if (etat === 'gameover') {
      g.fillStyle = `rgba(0,0,0,${Math.min(0.75, tEtat)})`; g.fillRect(0, 0, L, H);
      herosGrand(160, 170, 2, 1, { pose: 'assis', choco: heros.choco }, tJeu);
      if (tEtat > 0.6) texte('GAME OVER', 160, 34, ['#ffffff', '#ffd0d0', '#ff9090', '#ff5050', '#ff2020', '#d00000', '#a00000'], 4, '#2a0000', 'c');
      if (tEtat > 1.5 && Math.floor(tEtat * 2) % 2 === 0) texte(tactile ? "TOUCHE POUCE : RECOMMENCER LE MONDE" : 'START : RECOMMENCER LE MONDE', 160, 196, '#fff', 1, '#000', 'c');
    } else if (etat === 'bossIntro') {
      dessinerBossIntro();
    } else if (etat === 'fin') {
      // MONDE n TERMINÉ ! : il lève le pouce, le bonus de vie se compte
      g.fillStyle = `rgba(10,0,16,${Math.min(0.8, tEtat)})`; g.fillRect(0, 0, L, H);
      if (tEtat > 0.3) { g.globalAlpha = Math.min(1, (tEtat - 0.3) * 3); rayons(110, 150, tEtat * 0.5, 'rgba(0,0,0,0)', 'rgba(255,200,80,0.12)', 14); g.globalAlpha = 1; }
      herosGrand(100, 214, 2, 1, { pose: 'coup', choco: true }, tJeu);
      if (Math.floor(tJeu * 6) % 3 === 0) etincelle(100 + 20 * 2, 214 - 51 * 2, 4);
      texte(`MONDE ${monde}`, 220, 30, OR, 3, '#3a0a00', 'c');
      texte('TERMINÉ !', 220, 58, OR, 3, '#3a0a00', 'c');
      const bonus = Math.min(heros.vie * 10, Math.max(0, Math.round((tEtat - 1.2) * 600)));
      if (tEtat > 1) {
        texte(`VIE ${heros.vie} × 10`, 175, 100, '#ffffff', 1, '#000');
        texte(`+${finT ? heros.vie * 10 : bonus}`, 300, 100, '#ffe040', 1, '#000', 'd');
        texte('SCORE', 175, 116, '#ffffff', 1, '#000');
        texte(String(finT ? score : score + bonus).padStart(6, '0'), 300, 116, '#ffe040', 1, '#000', 'd');
      }
      if (tEtat > 2.8) { texte('PROCHAIN MONDE :', 220, 146, '#90e870', 1, '#0a2a04', 'c'); MONDES[monde + 1].titre.forEach((l, i) => texte(l, 220, 158 + i * 10, '#90e870', 1, '#0a2a04', 'c')); }
      if (tEtat > 3.2 && Math.floor(tEtat * 2) % 2 === 0) texte('START : CONTINUER', 220, 186, '#fff', 1, '#000', 'c');
    }
    if (etat === 'pause') {
      g.fillStyle = 'rgba(0,0,0,0.55)'; g.fillRect(0, 0, L, H);
      texte('PAUSE', L / 2, 96, ['#ffffff', '#fff8d0', '#ffe890', '#ffd850', '#ffc830', '#ffb820', '#ffa810'], 3, '#3a0a00', 'c');
      texte(tactile ? 'START POUR REPRENDRE' : 'ENTRÉE POUR REPRENDRE', L / 2, 130, '#fff', 1, '#000', 'c');
      texte(D().nom, L / 2, 150, '#c8a070', 1, '#000', 'c');
    }
  }
}
function boucle() {
  const t = performance.now() / 1000;
  let dt = Math.min(0.1, t - avant);
  avant = t;
  reste += dt;
  while (reste >= PAS) { mettreAJour(PAS); reste -= PAS; }
  dessiner(dt);
  requestAnimationFrame(boucle);
}
requestAnimationFrame(boucle);
// « index.html?test » : l'état du jeu lisible depuis la console (pour les essais automatiques)
if (new URLSearchParams(location.search).has('test')) window.__jeu = () => ({ etat, heros, ennemis, jauge, pouvoir, score, cam, bloque, monde, boss, obstacles, get pouvoir() { return pouvoir; }, set pouvoir(v) { pouvoir = v; }, get jauge() { return jauge; }, set jauge(v) { jauge = v; }, accueilT, generiqueOK, fini: generique.ended, temps: generique.currentTime, duree: generique.duration });
</script>
